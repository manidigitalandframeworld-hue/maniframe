<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Admin - Mani Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;600&display=swap');
        .brand-font { font-family: 'Cinzel', serif; }
        .body-font { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="body-font bg-gray-50 text-gray-800 p-4 sm:p-8">

    <div class="max-w-xl mx-auto bg-white border border-gray-200 shadow-sm p-6 sm:p-8">
        <div class="text-center border-b border-gray-100 pb-6 mb-6">
            <h1 class="brand-font text-2xl font-bold tracking-wider text-black">MANI DIGITAL & FRAME WORLD</h1>
            <p class="text-xs font-semibold uppercase tracking-widest text-amber-600 mt-1">Product Inventory Dashboard Panel</p>
        </div>

        <div id="status-msg" class="hidden mb-4 p-3 text-xs font-medium text-center"></div>

        <form id="add-product-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Product Title Name *</label>
                <input type="text" id="prod-name" placeholder="e.g., Luxury Matte Canvas Oil Portrait Painting" class="w-full border p-2.5 text-sm focus:outline-none focus:border-amber-600" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Price Evaluation (INR ₹) *</label>
                <input type="number" id="prod-price" placeholder="1500" class="w-full border p-2.5 text-sm focus:outline-none focus:border-amber-600" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Catalog Image Asset URL</label>
                <input type="url" id="prod-img" placeholder="https://example.com/image.jpg" class="w-full border p-2.5 text-sm focus:outline-none focus:border-amber-600">
                <p class="text-[10px] text-gray-400 mt-1">Leave empty to display default premium luxury art placeholder frame asset background.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Short Description</label>
                <textarea id="prod-desc" rows="3" placeholder="Soft texturing high-resolution photo optimization portrait structure variant..." class="w-full border p-2.5 text-sm focus:outline-none focus:border-amber-600"></textarea>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-black text-amber-400 hover:bg-gray-900 transition py-3 text-xs font-semibold tracking-widest uppercase mt-4">Publish Item to Catalog Live</button>
        </form>
    </div>

    <script type="module">
        import { db, collection, addDoc } from './firebase-config.js';

        const productForm = document.getElementById('add-product-form');
        const statusMsg = document.getElementById('status-msg');
        const btnSubmit = document.getElementById('btn-submit');

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Toggle processing interface lock states
            btnSubmit.innerText = "SYNCHRONIZING DOCUMENT ASSETS...";
            btnSubmit.disabled = true;

            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const image = document.getElementById('prod-img').value;
            const description = document.getElementById('prod-desc').value;

            try {
                // Upload transaction package context to Firestore reference directory
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: price,
                    image: image,
                    description: description,
                    timestamp: new Date()
                });

                showStatus("Product published successfully!", "success");
                productForm.reset();
            } catch (error) {
                console.error("Error committing administrative update document: ", error);
                showStatus("Error uploading metadata database attributes: " + error.message, "error");
            } finally {
                btnSubmit.innerText = "Publish Item to Catalog Live";
                btnSubmit.disabled = false;
            }
        });

        function showStatus(text, dynamicClass) {
            statusMsg.innerText = text;
            statusMsg.className = "mb-4 p-3 text-xs font-medium text-center block ";
            
            if(dynamicClass === 'success') {
                statusMsg.className += "bg-green-50 text-green-700 border border-green-200";
            } else {
                statusMsg.className += "bg-red-50 text-red-700 border border-red-200";
            }
            
            setTimeout(() => {
                statusMsg.className = "hidden";
            }, 5000);
        }
    </script>
</body>
</html>
